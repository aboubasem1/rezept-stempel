[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rezept-stempel"
version = "0.1.0"
description = "Lokales Werkzeug zum Stempeln von Rezept-PDFs mit Mengenangabe und Datum"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.24.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
rezept-stempel = "rezept_stempel.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
